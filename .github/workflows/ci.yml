name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every tool
        run: python -m compileall -q tools
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Audit the minimal example
        run: python tools/project_ops_audit.py --repo examples/minimal_project
      - name: Check the minimal example roadmap parity
        run: python tools/project_ops_roadmap.py --repo examples/minimal_project
      - name: Validate workflow syntax
        if: matrix.os == 'ubuntu-latest'
        run: |
          python - <<'PY'
          import pathlib, sys
          try:
              import yaml  # provided on GitHub runners
          except ImportError:
              print("PyYAML not available; skipping"); sys.exit(0)
          for p in pathlib.Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(p.read_text(encoding="utf-8")); print("ok", p)
          PY

  self-audit:
    # The reusable workflow must at least run against this repo's own example.
    uses: ./.github/workflows/reusable-project-ops-audit.yml
    with:
      project-ops-ref: ${{ github.sha }}
      repo-path: examples/minimal_project
